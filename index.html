<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Operaciones - CEVA Logistics</title>
<!-- Vinculamos el archivo de estilos externo -->
<link rel="stylesheet" href="styles.css">
<!-- Librería de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!-- Librería SheetJS para procesar y leer archivos Excel (.xlsx / .csv) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- ================= PANTALLA DE LOGIN ================= -->
<div id="vista-login">
  <div class="tarjeta-login">
    <h2>CONTROL DE<br>OPERACIONES</h2>
    <div class="sub-login">LATAM 400</div>
    <div class="error-login" id="error-login">Usuario o contraseña incorrectos.</div>
    <form id="form-login">
      <label>Usuario o DNI</label>
      <input type="text" id="login-usuario" placeholder="Ej: mperez  (auxiliares: su DNI)" required autocomplete="username" autocapitalize="none" spellcheck="false">

      <div class="grupo-password">
        <label>Contraseña</label>
        <input type="password" id="login-password" placeholder="Auxiliares: dejar vacía" autocomplete="current-password">
        <button type="button" class="btn-ver" id="btn-toggle-password" title="Mostrar/Ocultar contraseña">👁️</button>
      </div>

      <button type="submit" class="btn-ingresar">INGRESAR</button>
    </form>
  </div>
</div>

<!-- ================= CONTENEDOR PRINCIPAL DE LA PLATAFORMA ================= -->
<div id="contenedor-principal">
  <!-- BARRA LATERAL -->
  <aside class="sidebar">
    <div class="logo">
      <img src="logo.png" alt="CEVA Logistics" onerror="this.style.display='none'; document.getElementById('logo-texto').style.display='block';">
      <div id="logo-texto" style="display:none">
        <div class="texto-logo">CEV<span>A</span></div>
        <div class="sub-logo">LOGISTICS</div>
      </div>
      <h1>CONTROL DE OPERACIONES</h1>
      <div class="planta">LATAM 400</div>
    </div>

    <div class="usuario">
      <strong id="nombre-usuario-display"></strong>
      <span id="cargo-usuario-display"></span><br>
      <span class="etiqueta-rol" id="etiqueta-rol"></span>
    </div>

    <nav class="menu" id="menu"></nav>

    <div class="demo-rol">
      <label>Sesión activa</label>
      <button id="btn-cerrar-sesion">Cerrar Sesión</button>
    </div>
  </aside>

  <!-- CONTENIDO -->
  <main class="contenido" id="principal"></main>
</div>

<!-- VENTANA EMERGENTE: DASHBOARDS -->
<div class="fondo-modal" id="modal">
  <div class="modal">
    <h3 id="modal-titulo"></h3>
    <label>Nombre del dashboard</label>
    <input type="text" id="input-nombre" placeholder="Ej: Paletas">
    <label>Enlace de Power BI</label>
    <input type="text" id="input-url" placeholder="https://app.powerbi.com/reportEmbed?reportId=...">
    <div class="botones">
      <button class="btn gris" data-acc="cerrar-modal">Cancelar</button>
      <button class="btn" data-acc="guardar-modal">Guardar</button>
    </div>
  </div>
</div>

<!-- VENTANA EMERGENTE: UNA PERSONA -->
<div class="fondo-modal" id="modal-aux">
  <div class="modal">
    <h3 id="modal-aux-titulo">Nueva persona</h3>
    <label>Rol</label>
    <select id="per-rol">
      <option value="auxiliar">Auxiliar de piso (ingresa solo con DNI)</option>
      <option value="asistente">Asistente (usuario y contraseña)</option>
      <option value="admin">Administradora (usuario y contraseña)</option>
    </select>
    <label id="per-etq-usuario">DNI (con esto ingresa)</label>
    <input type="text" id="per-usuario" maxlength="30" autocomplete="off" autocapitalize="none">
    <label>Nombre</label>
    <input type="text" id="per-nombre" placeholder="Ej: KIARA LOPEZ" autocomplete="off">
    <label>Cargo (opcional)</label>
    <input type="text" id="per-cargo" placeholder="Ej: Asistente de Inventario" autocomplete="off">
    <div id="per-grupo-pass" style="display:none">
      <label>Contraseña</label>
      <input type="text" id="per-pass" autocomplete="new-password">
    </div>
    <div class="botones">
      <button class="btn gris" data-acc="aux-cerrar">Cancelar</button>
      <button class="btn" data-acc="aux-guardar">Guardar</button>
    </div>
  </div>
</div>

<!-- VENTANA EMERGENTE: PEGAR LISTA DE AUXILIARES -->
<div class="fondo-modal" id="modal-lote">
  <div class="modal">
    <h3>Pegar lista de auxiliares</h3>
    <label>Una persona por línea: DNI, separador y nombre</label>
    <textarea id="lote-texto" placeholder="12345678	KIARA LOPEZ&#10;87654321	JUAN PEREZ"></textarea>
    <div class="botones">
      <button class="btn gris" data-acc="aux-cerrar">Cancelar</button>
      <button class="btn" data-acc="aux-guardar-lote">Guardar lista</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Vinculamos el archivo de lógica JavaScript externo -->
<script src="app.js"></script>
</body>
</html>
